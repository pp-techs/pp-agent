packages:
  - apps/*
  - packages/*

catalogMode: prefer

# Project policy: always take the newest published versions. This turns off pnpm's default
# release-age delay (a supply-chain guard); restore it by deleting this line.
minimumReleaseAge: 0

allowBuilds:
  "@google/genai": false
  "@officecli/officecli": true
  electron-winstaller: false
  protobufjs: false
  tesseract.js: false

catalog:
  "@base-ui/react": ^1.9.0
  "@buiducnhat/better-modal": ^0.0.6
  "@changesets/cli": ^3.0.3
  "@earendil-works/pi-agent-core": ^1.4.0
  "@earendil-works/pi-ai": ^1.4.0
  "@earendil-works/pi-coding-agent": ^1.4.0
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@officecli/officecli": ^1.0.159
  "@shadcn/react": ^0.3.1
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.104.5
  "@tanstack/react-query-devtools": ^5.104.5
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.5.0
  electron: ^45.0.0
  electron-builder: ^26.15.3
  fflate: ^0.8.3
  i18next: ^26.5.6
  lucide-react: ^1.61.0
  next-themes: ^0.4.6
  officeparser: ^8.2.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.3
  shadcn: ^4.22.1
  shiki: ^4.5.0
  sonner: ^2.0.8
  streamdown: ^2.7.1
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typebox: ^1.4.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  yaml: ^2.9.1
  zustand: ^5.0.16
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
