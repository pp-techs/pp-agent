packages:
  - apps/*
  - packages/*

catalogMode: prefer

# Supply-chain guard: a version must be public for a day before pnpm installs it, so a
# hijacked release is usually pulled before it reaches this repo. Exceptions are listed in
# `minimumReleaseAgeExclude` below.
minimumReleaseAge: 1440

allowBuilds:
  "@google/genai": false
  "@officecli/officecli": true
  electron-winstaller: false
  node-pty: true
  protobufjs: false
  tesseract.js: false

catalog:
  "@base-ui/react": ^1.9.0
  "@buiducnhat/better-modal": ^1.0.0
  "@capacitor/android": ^8.6.0
  "@capacitor/barcode-scanner": ^3.1.3
  "@capacitor/cli": ^8.6.0
  "@capacitor/core": ^8.6.0
  "@capacitor/filesystem": ^8.1.5
  "@capacitor/ios": ^8.6.0
  "@capacitor/keyboard": ^8.0.6
  "@capacitor/share": ^8.0.3
  "@changesets/cli": ^3.0.3
  "@earendil-works/pi-agent-core": ^1.4.0
  "@earendil-works/pi-ai": ^1.4.0
  "@earendil-works/pi-coding-agent": ^1.4.0
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@officecli/officecli": ^1.0.159
  "@shadcn/react": ^0.3.1
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.105.0
  "@tanstack/react-query-devtools": ^5.105.0
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  "@xterm/addon-fit": ^0.11.0
  "@xterm/xterm": ^6.0.0
  class-variance-authority: ^0.7.1
  cmdk: ^1.1.1
  cn: ^0.5.1
  electron-builder: ^26.18.0
  electron: ^45.1.0
  fflate: ^0.8.3
  i18next: ^26.5.11
  lucide-react: ^1.64.0
  next-themes: ^0.4.6
  node-pty: ^1.1.0
  officeparser: ^8.4.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.9
  react: ^19.3.1
  shadcn: ^4.23.0
  shiki: ^4.5.0
  sonner: ^2.0.8
  streamdown: ^2.7.1
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typebox: ^1.4.3
  typescript: ^7.0.2
  uqr: ^0.1.3
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  yaml: ^2.9.1
  zustand: ^5.0.16
  "@iconify-json/vscode-icons": ^1.2.96
  "@iconify/utils": ^3.1.7
overrides:
  vite@*: "catalog:"
  # Security fixes the dependents' ranges do not pick up yet; each stays on its own major line.
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
patchedDependencies:
  "@shadcn/react@0.3.1": patches/@shadcn__react@0.3.1.patch
