name: Release

# Release flow (docs/code-standard/release-process.md). Every push to main runs `plan`:
#
# - changesets pending → `version` opens or updates the "Version Packages" PR
#   (`vp run version-packages`: lockstep bump of desktop + web, CHANGELOGs, root version);
# - no changesets, the root CHANGELOG has a section for the committed version, and that version has
#   no GitHub Release yet → `verify` checks the commit, `package` builds the installers on macOS,
#   Windows, and Linux, and `publish` (environment `release`) tags vX.Y.Z and creates the GitHub
#   Release with the installers and their SHA-256 checksums;
# - otherwise nothing.
#
# Merging the Version Packages PR is the release. A failed run is retried by re-running the failed
# jobs: an existing tag or Release is left alone.
#
# Code signing is optional and driven by repository secrets (docs/code-standard/release-process.md):
# - macOS: with CSC_LINK + CSC_KEY_PASSWORD (Developer ID .p12) the app is signed with the hardened
#   runtime; with APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID as well it is notarized
#   (a warning is printed when some of those are missing). Without a certificate the app is
#   ad-hoc signed and not notarized.
# - Windows: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD sign the installer; without them it is unsigned.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select mode
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          mode=none
          if [ "$pending" -gt 0 ]; then
            mode=version
          elif grep -qF "## [$version]" CHANGELOG.md; then
            # Exit 0 = the Release exists; a 404 = not yet; anything else must not guess.
            if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
              :
            elif grep -q 'HTTP 404' <<< "$out"; then
              mode=publish
            else
              echo "::error::could not look up release v$version: $out"
              exit 1
            fi
          fi
          echo "$pending pending changesets, version $version → mode $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  version:
    name: Version Packages PR
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      # The PR is created with GITHUB_TOKEN, so CI does not run on it; `verify` re-runs the checks
      # on the merged commit before anything is published. Needs "Allow GitHub Actions to create
      # and approve pull requests" in the repository settings.
      - name: Create or update the Version Packages PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: vp run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  verify:
    name: Verify release
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check lockstep versions
        run: |
          for manifest in package.json apps/desktop/package.json apps/web/package.json; do
            actual=$(jq -r .version "$manifest")
            if [ "$actual" != "$VERSION" ]; then
              echo "::error file=$manifest::version $actual, expected $VERSION"
              exit 1
            fi
          done

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Check (format, lint, typecheck)
        run: vp check

      - name: Extract release notes
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error file=CHANGELOG.md::no section for [$VERSION]"
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package (${{ matrix.name }})
    needs: [plan, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # Let every platform finish so one failure shows all problems; `publish` still needs all.
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            platform: --mac
            arch: --arm64
            artifact: installers-mac-arm64
          - name: macOS x64
            # An Intel runner: @officecli/officecli installs the binary of the machine it runs on.
            runner: macos-15-intel
            platform: --mac
            arch: --x64
            artifact: installers-mac-x64
          - name: Windows x64
            runner: windows-latest
            platform: --win
            arch: --x64
            artifact: installers-win-x64
          - name: Linux x64
            runner: ubuntu-latest
            platform: --linux
            arch: --x64
            artifact: installers-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Build renderer and desktop bundles
        run: vp run -r build

      - name: Make installers
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          # electron-builder only warns when an extraResources source is missing; fail instead of
          # shipping an app without OfficeCLI.
          test -d ../../packages/agent-core/node_modules/@officecli/officecli/vendor
          # webclaw is not an npm package: download the binary for this runner (checksum-pinned).
          node scripts/fetch-webclaw.mjs --require
          # cua-driver (computer use, checksum-pinned) ships on macOS and Windows only.
          if [ "$PLATFORM" = "--linux" ]; then node scripts/fetch-cua-driver.mjs; else node scripts/fetch-cua-driver.mjs --require; fi
          args=(--config electron-builder.yml "$PLATFORM" "$ARCH" --publish never)
          if [ "$PLATFORM" = "--mac" ]; then
            if [ -z "$CSC_LINK" ]; then
              # No certificate: ad-hoc sign (Apple silicon refuses unsigned apps). The hardened
              # runtime only matters for notarization, which needs a Developer ID anyway.
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false)
              echo "::warning::CSC_LINK is not set: macOS build is ad-hoc signed and not notarized."
            elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              # Developer ID signing with the hardened runtime, then notarization (electron-builder.yml).
              args+=(-c.extraMetadata.ppDeveloperIdSigned=true)
            else
              # electron-builder fails on partial Apple credentials, so skip notarization explicitly.
              args+=(-c.mac.notarize=false -c.extraMetadata.ppDeveloperIdSigned=true)
              echo "::warning::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD or APPLE_TEAM_ID is not set: macOS build is signed but not notarized."
            fi
          fi
          if [ "$PLATFORM" = "--mac" ] && [ -n "$CSC_LINK" ]; then
            # electron-builder passes the .p12 password to `security set-key-partition-list` as the
            # password of its temporary keychain, which fails on current runners ("SecKeychainUnlock:
            # The user name or passphrase you entered is not correct"). Import the certificate into
            # a keychain of our own and let electron-builder discover the identity in it.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(uuidgen)"
            cert="$RUNNER_TEMP/developer-id.p12"
            case "$CSC_LINK" in
              http*) curl -fsSL --proto '=https' --proto-redir '=https' "$CSC_LINK" -o "$cert" ;;
              *) printf '%s' "$CSC_LINK" | base64 --decode > "$cert" ;;
            esac
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$cert" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm -f "$cert"
            # `find-identity` exits 0 even with no identity; fail here instead of building unsigned.
            security find-identity -v -p codesigning "$keychain" | tee "$RUNNER_TEMP/identities.txt"
            grep -q 'Developer ID Application' "$RUNNER_TEMP/identities.txt" || {
              echo "::error::No valid Developer ID Application identity in the imported certificate."
              exit 1
            }
            export CSC_KEYCHAIN="$keychain"
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          # Unset empty secrets so electron-builder does not treat them as configured.
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          # Windows builds are signed only with WIN_CSC_LINK; never pick up the macOS CSC_LINK there.
          if [ "$PLATFORM" = "--win" ] && [ -z "${WIN_CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          vp exec electron-builder "${args[@]}"
          # Each macOS job writes a feed for its own architecture; `publish` merges them.
          if [ "$PLATFORM" = "--mac" ]; then
            mv release/latest-mac.yml "release/latest-mac-${ARCH#--}.yml"
          fi

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest.yml
            apps/desktop/release/latest-linux.yml
            apps/desktop/release/latest-mac-*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [plan, verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment (Settings → Environments) for a human gate.
    environment: release
    permissions:
      contents: write # tag + GitHub Release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # No checkout: this job only handles the verified artifacts.
      - name: Download installers and notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release

      - name: Collect assets
        id: assets
        run: |
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          find "$RUNNER_TEMP/release" -path '*/installers-*/*' -type f -exec mv {} "$assets/" \;
          # The installed app finds updates through these feeds; a release without them cannot update.
          # One macOS feed that lists both architectures; electron-updater picks the matching files.
          yq eval-all '. as $item ireduce ({}; . *+ $item)' \
            "$assets"/latest-mac-arm64.yml "$assets"/latest-mac-x64.yml > "$assets/latest-mac.yml"
          rm "$assets"/latest-mac-arm64.yml "$assets"/latest-mac-x64.yml
          for feed in latest.yml latest-linux.yml latest-mac.yml; do
            [ -f "$assets/$feed" ] || { echo "::error::Missing update feed $feed"; exit 1; }
          done
          (cd "$assets" && sha256sum -- * > SHA256SUMS.txt)
          ls -l "$assets"
          echo "dir=$assets" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ steps.assets.outputs.dir }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $tag already exists"
            exit 0
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PP Agent $tag" \
            --notes-file "$RUNNER_TEMP/release/release-notes/notes.md" \
            "${prerelease[@]}" \
            "$ASSETS"/*
