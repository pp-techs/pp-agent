name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (format, lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Check
        run: vp check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Build
        run: vp run -r build

      # Linux installers (AppImage + deb): proves the electron-builder config on every change,
      # including target-specific checks an unpacked build skips.
      - name: Package (Linux installers)
        working-directory: apps/desktop
        run: |
          # electron-builder only warns when an extraResources source is missing; fail instead of
          # shipping an app without OfficeCLI.
          test -d ../../packages/agent-core/node_modules/@officecli/officecli/vendor
          vp exec electron-builder --config electron-builder.yml --linux --x64 --publish never
          # The release workflow uploads this feed; the installed app finds updates through it.
          test -f release/latest-linux.yml

  # Windows installer (NSIS), unsigned and never run: proves the electron-builder config on Windows.
  build-windows:
    name: Build (Windows installer)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Build
        run: vp run -r build

      - name: Package (Windows installer)
        shell: bash
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # electron-builder only warns when an extraResources source is missing; fail instead of
          # shipping an app without OfficeCLI.
          test -d ../../packages/agent-core/node_modules/@officecli/officecli/vendor
          vp exec electron-builder --config electron-builder.yml --win --x64 --publish never
          # The release workflow uploads this feed; the installed app finds updates through it.
          test -f release/latest.yml

  changeset:
    name: Changeset
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Advisory: app changes usually need a changeset (docs, CI, and refactors do not).
      - name: Look for a changeset
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          if grep -E '^\.changeset/[^/]+\.md$' <<< "$changed" | grep -qvxF .changeset/README.md; then
            echo "Changeset found."
          elif grep -qE '^(apps|packages)/' <<< "$changed"; then
            echo "::warning::This PR changes app code but adds no changeset. Run \`vp run changeset\` if users will notice the change."
          else
            echo "No app changes."
          fi
