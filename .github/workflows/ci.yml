name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (format, lint, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - name: Check
        run: vp check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - name: Build
        run: vp run -r build

      # Linux installers (AppImage + deb): proves the electron-builder config on every change,
      # including target-specific checks an unpacked build skips.
      - name: Package (Linux installers)
        working-directory: apps/desktop
        run: vp exec electron-builder --config electron-builder.yml --linux --x64 --publish never

  changeset:
    name: Changeset
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Advisory: app changes usually need a changeset (docs, CI, and refactors do not).
      - name: Look for a changeset
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          if grep -E '^\.changeset/[^/]+\.md$' <<< "$changed" | grep -qvxF .changeset/README.md; then
            echo "Changeset found."
          elif grep -qE '^(apps|packages)/' <<< "$changed"; then
            echo "::warning::This PR changes app code but adds no changeset. Run \`vp run changeset\` if users will notice the change."
          else
            echo "No app changes."
          fi
