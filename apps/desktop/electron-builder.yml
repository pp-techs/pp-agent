appId: com.pptechs.agent
productName: PP Agent
copyright: Copyright © 2026 PP Techs
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  # Built by `vp run @workspace/web#build`; loaded by the main process in packaged builds.
  - from: ../web/dist
    to: renderer
asar: true
# Space-free names for release assets, e.g. pp-agent-0.1.0-mac-arm64.dmg.
artifactName: pp-agent-${version}-${os}-${arch}.${ext}
# Installers are attached to GitHub Releases by .github/workflows/release.yml (always run with
# `--publish never`). This block only makes electron-builder write the update feed (latest*.yml)
# and the app-update.yml the installed app reads to find new releases.
publish:
  provider: github
  owner: pp-techs
  repo: pp-agent
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  # The package name (@workspace/desktop) is not a valid file name.
  executableName: pp-agent
  target: [AppImage, deb]
  category: Office
  maintainer: PP Techs <https://github.com/pp-techs>
  synopsis: Desktop AI agent for business teams
