appId: com.pptechs.agent
productName: PP Agent
copyright: Copyright © 2026 PP Techs
directories:
  output: release
  # icon.icns (macOS), icon.ico (Windows) and icon.png (Linux) are picked up from here.
  buildResources: build
files:
  - dist/**
  - package.json
  # The binary ships once, via extraResources below; inside the asar archive it could not run.
  - "!**/node_modules/@officecli/officecli/vendor/**"
extraResources:
  # Built by `vp run @workspace/web#build`; loaded by the main process in packaged builds.
  - from: ../web/dist
    to: renderer
  # Tray icons (PNG), read by the main process in packaged builds. electron-builder only warns
  # ("file source doesn't exist") when the directory is missing.
  - from: resources/tray
    to: tray
  # Window icon (PNG) for Windows and Linux, read by the main process in packaged builds.
  - from: resources/icons
    to: icons
  # OfficeCLI (Apache-2.0) for office_read/office_edit: the binary the @officecli/officecli package
  # installed for this platform (checksum-verified at install), its license texts, and the skills
  # written for it. The binary is signed with the app on macOS.
  - from: ../../packages/agent-core/node_modules/@officecli/officecli/vendor
    to: officecli/${os}-${arch}
  - from: resources/licenses/officecli
    to: licenses/officecli
  - from: resources/skills
    to: skills
  # webclaw (AGPL-3.0) turns the HTML of a web page into Markdown: the binary scripts/fetch-webclaw.mjs
  # downloaded for this platform, plus its license and where its source is. Windows on ARM has no
  # build; the app then converts pages with its own code.
  - from: resources/webclaw/${os}-${arch}
    to: webclaw/${os}-${arch}
    filter:
      - "!.version"
  - from: resources/licenses/webclaw
    to: licenses/webclaw
asar: true
# Native addons cannot load from inside the asar archive (the daemon's OS keyring binding, and
# the side panel terminal with its spawn-helper program).
asarUnpack:
  - node_modules/@napi-rs/**
  - node_modules/node-pty/**
# Gives node-pty's spawn-helper the execute bit its package lost, before the app is signed.
afterPack: scripts/after-pack.cjs
# Space-free names for release assets, e.g. pp-agent-0.1.0-mac-arm64.dmg.
artifactName: pp-agent-${version}-${os}-${arch}.${ext}
# Installers are attached to GitHub Releases by .github/workflows/release.yml (always run with
# `--publish never`). This block only makes electron-builder write the update feed (latest*.yml)
# and the app-update.yml the installed app reads to find new releases.
publish:
  provider: github
  owner: pp-techs
  repo: pp-agent
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
  # Developer ID signing needs the hardened runtime; notarization requires it. With no certificate
  # the release workflow overrides this (ad-hoc signature, no hardened runtime).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  extendInfo:
    # Shown by macOS when voice input asks for the microphone for the first time.
    NSMicrophoneUsageDescription: PP Agent uses the microphone only while you record a voice message to turn it into text.
  # Notarizes only when APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID are set (or an API
  # key / keychain profile); otherwise electron-builder logs "skipped macOS notarization". The
  # release workflow passes -c.mac.notarize=false for unsigned or ad-hoc builds.
  notarize: true
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  # The package name (@workspace/desktop) is not a valid file name.
  executableName: pp-agent
  target: [AppImage, deb]
  category: Office
  maintainer: PP Techs <https://github.com/pp-techs>
  synopsis: Desktop AI agent for business teams
