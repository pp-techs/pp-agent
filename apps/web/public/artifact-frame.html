<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      The frame page of an HTML preview outside the desktop app (a browser on the local network, and
      the phone app). The desktop app serves this same page from its `pp-artifact` scheme; here it is
      a page of the app's own origin, so it carries its policy in this tag - a same-origin frame does
      not inherit the app page's policy. As on the desktop: no network, no nested frames, no forms,
      and inline styles and scripts only. `'self'` is the preview libraries bundled beside this page
      (`artifact-libs/`), which the renderer names in the HTML it posts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'self'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"
    />
  </head>
  <body>
    <script>
      // The renderer posts `{ type: "render", html }` once, after the person presses Run. The page
      // writes it into its own document (the policy above stays with the document), followed by a
      // script that reports the content height, which the renderer uses to size the frame.
      addEventListener("message", function onRender(event) {
        if (event.source !== parent || !event.data || event.data.type !== "render") return;
        removeEventListener("message", onRender);
        var report =
          "<script>(function(){var last=0;function send(){var h=Math.ceil(document.documentElement.getBoundingClientRect().height);if(h!==last){last=h;parent.postMessage({type:'height',height:h},'*');}}new ResizeObserver(send).observe(document.documentElement);addEventListener('load',send);send();})();<\/script>";
        document.open();
        document.write(String(event.data.html) + report);
        document.close();
      });
      parent.postMessage({ type: "ready" }, "*");
    </script>
  </body>
</html>
